trigger:
- main

variables:
  acrName: devopsacr78901
  imageName: devsecops-app

stages:

- stage: Build
  jobs:
  - job: BuildPush
    pool:
      vmImage: ubuntu-latest

    steps:

    - task: Docker@2
      inputs:
        containerRegistry: 'acr-connection'
        repository: $(imageName)
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          latest

- stage: Deploy
  dependsOn: Build
  jobs:
  - job: DeployToAKS
    pool:
      vmImage: ubuntu-latest

    steps:

    - task: KubernetesManifest@1
      inputs:
        action: deploy
        kubernetesServiceConnection: 'aks-connection'
        namespace: default
        manifests: |
          k8s/deployment.yml
          k8s/service.yml